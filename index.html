            const attribution = line.substring(sepIdx + sep.length);

            if (byIdx === -1) return { quote: advice, source: attribution, author: '' };
            return { quote: advice, source: attribution.substring(0, byIdx), author: attribution.substring(byIdx + 4) };

            { quote: "When I wake up, the other side of the bed is cold.", source: "The Hunger Games", author: "Suzanne Collins" },
            { quote: "When I stepped out into the bright sunlight from the darkness of the movie house, I had only two things on my mind: Paul Newman and a ride home.", source: "The Outsiders", author: "S.E. Hinton" },
            { quote: "When he was nearly thirteen, my brother Jem got his arm badly broken at the elbow.", source: "To Kill a Mockingbird", author: "Harper Lee" },
            { quote: "This is my favorite book in all the world, though I have never read it.", source: "The Princess Bride", author: "William Goldman" },
            { quote: "It was almost December, and Jonas was beginning to be frightened.", source: "The Giver", author: "Lois Lowry" },
            { quote: "Brian Robeson stared out the window of the small plane at the endless green northern wilderness below.", source: "Hatchet", author: "Gary Paulsen" },
            { quote: "I know I'm not an ordinary ten-year-old kid.", source: "Wonder", author: "R.J. Palacio" },
            { quote: "In the light of the moon a little egg lay on a leaf.", source: "The Very Hungry Caterpillar", author: "Eric Carle" },
            { quote: "I am Sam.", source: "Green Eggs and Ham", author: "Dr. Seuss" },
            { quote: "The sun did not shine.", source: "The Cat in the Hat", author: "Dr. Seuss" },
            { quote: "One winter morning Peter woke up and looked out the window.", source: "The Snowy Day", author: "Ezra Jack Keats" },
            { quote: "He began his new life standing up, surrounded by cold darkness and stale, dusty air.", source: "The Maze Runner", author: "James Dashner" }
        ];

        let activeSection = 'first-impressions';
        let pool = [];
        let poolIndex = 0;
        let cardState = 'empty'; // 'empty' | 'front' | 'back'
        let isAnimating = false;
        let currentQuoteData = null;

        const flipInner = document.getElementById('flipInner');
        const cardFront = document.getElementById('cardFront');
        const cardContent = document.getElementById('cardContent');
        const backContent = document.getElementById('backContent');
        const crackBtn = document.getElementById('crackBtn');
        const luckyNumbersEl = document.getElementById('luckyNumbers');
        const numbersDisplay = document.getElementById('numbersDisplay');
        const messageBox = document.getElementById('messageBox');
        const messageBoxInner = document.getElementById('messageBoxInner');

        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function nextLine() {
            const dataset = activeSection === 'first-impressions' ? LINES : TIMELESS_ADVICE;
            if (poolIndex >= pool.length) { pool = shuffle(dataset); poolIndex = 0; }
            return pool[poolIndex++];
        }

        function setSection(section) {
            if (section === activeSection || isAnimating) return;
            activeSection = section;
            pool = []; poolIndex = 0;

            flipInner.classList.remove('rotate-y-180', 'has-content');
            cardState = 'empty';
            
            // Fade out old text
            cardFront.style.opacity = '0';
            
            setTimeout(() => {
                cardContent.innerHTML = '<span class="text-[10px] font-mono tracking-[0.2em] uppercase text-ink/40 text-center">tap the button for your fortune</span>';
                backContent.innerHTML = '';
                luckyNumbersEl.classList.remove('opacity-100');
                cardFront.style.opacity = '1';
            }, 300);

            // Update UI tabs
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.dataset.section === section) {
                    btn.className = "tab-btn px-4 py-1.5 rounded text-[10px] font-mono font-bold tracking-widest uppercase border border-gold-500/60 text-gold-500 bg-gold-500/10 transition-all focus:outline-none";
                } else {
                    btn.className = "tab-btn px-4 py-1.5 rounded text-[10px] font-mono font-bold tracking-widest uppercase border border-gold-600/30 text-gray-400 hover:text-gold-400 hover:border-gold-500/50 transition-all focus:outline-none";
                }
            });

            document.getElementById('subtitle').textContent =
                section === 'first-impressions'
                    ? 'famous first lines from great books'
                    : 'cautionary wisdom from great books';
        }

        function generateLuckyNumbers() {
            return Array.from({length: 5}, () => Math.floor(Math.random() * 99) + 1)
                .map(n => n.toString().padStart(2, '0'))
                .join('  ');
        }

        function crackCookie() {
            if (isAnimating) return;
            isAnimating = true;
            crackBtn.disabled = true;
            crackBtn.classList.add('opacity-50');

            // 1. Shake animation
            flipInner.classList.add('animate-shake');
            
            setTimeout(() => {
                flipInner.classList.remove('animate-shake');
                
                // If on back, flip to front first
                if (cardState === 'back') {
                    flipInner.classList.remove('rotate-y-180');
                    setTimeout(() => updateCardContent(), 350);
                } else {
                    updateCardContent();
                }
            }, 400);
        }

        function updateCardContent() {
            cardFront.style.opacity = '0'; 
            
            setTimeout(() => {
                const line = nextLine();
                currentQuoteData = line;
                
                // Front
                cardContent.innerHTML = `<p class="text-[17px] md:text-[20px] italic text-ink text-center leading-relaxed font-serif px-2">"${line.quote}"</p>`;
                
                // Back - Title and Author (Lucky Numbers are static HTML, we just update the text)
                backContent.innerHTML = `
                    <div class="text-lg md:text-xl italic font-serif text-ink/90 text-center leading-snug px-4">${line.source}</div>
                    <div class="text-[9px] font-mono tracking-[0.25em] uppercase text-ink/40">by</div>
                    <div class="text-sm font-mono text-ink/70 tracking-wide text-center">${line.author}</div>
                `;
                
                // Setup Lucky Numbers
                numbersDisplay.textContent = generateLuckyNumbers();
                luckyNumbersEl.classList.remove('opacity-100'); // reset visibility for flip

                flipInner.classList.add('has-content');
                cardState = 'front';
                
                cardFront.style.opacity = '1'; 
                
                setTimeout(() => {
                    isAnimating = false;
                    crackBtn.disabled = false;
                    crackBtn.classList.remove('opacity-50');
                }, 300);
                
            }, 300);
        }

        function handleCardClick() {
            if (cardState === 'empty' || isAnimating) return;
            isAnimating = true;
            
            if (cardState === 'front') {
                flipInner.classList.add('rotate-y-180');
                cardState = 'back';
                setTimeout(() => {
                    luckyNumbersEl.classList.add('opacity-100');
                }, 300); // Reveal lucky numbers smoothly after flip
            } else {
                luckyNumbersEl.classList.remove('opacity-100');
                flipInner.classList.remove('rotate-y-180');
                cardState = 'front';
            }
            
            setTimeout(() => { isAnimating = false; }, 700);
        }

        function copyQuote(e) {
            e.stopPropagation(); // Prevent card from flipping
            if(!currentQuoteData) return;
            
            const textToCopy = `"${currentQuoteData.quote}"\n— ${currentQuoteData.source} by ${currentQuoteData.author}`;
            
            // Fallback for document.execCommand
            const textArea = document.createElement("textarea");
            textArea.value = textToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Failed to copy', err);
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-4');
            }, 2000);
        }

        function navigateHome() {
            messageBox.classList.remove('hidden');
            // small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                messageBox.classList.remove('opacity-0');
                messageBoxInner.classList.remove('scale-95');
                messageBoxInner.classList.add('scale-100');
            }, 10);
        }

        function closeMessageBox() {
            messageBox.classList.add('opacity-0');
            messageBoxInner.classList.remove('scale-100');
            messageBoxInner.classList.add('scale-95');
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
